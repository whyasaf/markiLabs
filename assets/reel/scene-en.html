<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  :root { --bg: #f0f1fa; --fg: #2b2e3a; --a: #1f45ff; }
  html, body { width: 1600px; height: 900px; }
  body { font-family: "Inter Tight", sans-serif; font-weight: 500; letter-spacing: -0.04em; }
  /* Sitedeki etiket stili (globals.css .label): ana font, normal yazılış */
  .mono { font-family: "Inter Tight", sans-serif; font-size: 21px; font-weight: 500; letter-spacing: -0.01em; color: #6b6f7d; }
  .blue { color: var(--a); }

  /* Şerit: çizilerek gelir */
  .ribbon path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s cubic-bezier(.65,0,.35,1) var(--d) both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* Sahne 1 */
  #s1 .logo { position: absolute; left: 50%; top: 50%; width: 560px; transform: translate(-50%, -50%); }
  #s1 .logo img { width: 100%; animation: logoIn 1s cubic-bezier(.22,1,.36,1) var(--d) both; }
  @keyframes logoIn { from { opacity: 0; transform: translateY(40px) scale(.92); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }

  /* Sahne 2: dönen kelime */
  #s2 h1 { font-size: 150px; line-height: .98; padding: 0 120px; }
  .slot { position: relative; display: block; height: 1.12em; overflow: hidden; }
  .slot span { position: absolute; left: 0; top: 0; color: var(--a); opacity: 0;
    animation: wIn .8s cubic-bezier(.76,0,.24,1) var(--d) both, wOut .8s cubic-bezier(.76,0,.24,1) var(--o) forwards; }
  /* ilk kelime alttan yumuşak gelir; sonrakiler gidenle aynı anda, aynı eğriyle: hep 150% arayla, çakışmaz (harf kuyrukları da kutudan tam çıkar) */
  .slot span.first { animation: wIn .8s cubic-bezier(.22,1,.36,1) var(--d) both, wOut .8s cubic-bezier(.76,0,.24,1) var(--o) forwards; }
  .slot span.last { animation: wIn .8s cubic-bezier(.76,0,.24,1) var(--d) both; }
  @keyframes wIn { from { opacity: 1; transform: translateY(150%); } to { opacity: 1; transform: none; } }
  @keyframes wOut { from { opacity: 1; transform: none; } to { opacity: 1; transform: translateY(-150%); } }

  /* Sahne 3: işler ızgarası */
  #s3 { padding: 80px 100px; }
  #s3 h2 { font-size: 76px; margin-bottom: 44px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .card { aspect-ratio: 16/10; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 30px 60px -30px rgba(43,46,58,.35);
    animation: fly 1s cubic-bezier(.22,1,.36,1) var(--d) both; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes fly { from { opacity: 0; transform: translateY(260px) rotate(var(--r)) scale(.8); } to { opacity: 1; transform: none; } }

  /* Sahne 4: kendi ürünlerimiz */
  #s4 { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; padding: 110px 100px 0; }
  #s4 h2 { grid-column: 1 / -1; font-size: 76px; margin-bottom: 10px; }
  .big { animation: slideX 1.1s cubic-bezier(.22,1,.36,1) var(--d) both; }
  .big .img { aspect-ratio: 16/10; border-radius: 22px; overflow: hidden; background: #fff; }
  .big img { width: 100%; height: 100%; object-fit: cover; display: block; animation: kb 4s linear var(--d) both; }
  .big .meta { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 6px 0; }
  .big b { font-size: 40px; font-weight: 500; }
  @keyframes slideX { from { opacity: 0; transform: translateX(var(--x)); } to { opacity: 1; transform: none; } }

  /* Sahne 5: Tasarım. Yazılım. Yayın. */
  #s5 .words { position: absolute; left: 100px; top: 110px; font-size: 140px; line-height: 1; }
  #s5 .strip { position: absolute; left: 0; bottom: 44px; display: flex; gap: 20px; animation: strip 4s linear var(--d) both; }
  #s5 .ph { width: 460px; height: 270px; border-radius: 20px; overflow: hidden; background: #bcc4ff; position: relative; isolation: isolate; }
  #s5 .ph img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.1) brightness(1.1); mix-blend-mode: multiply; display: block; }
  #s5 .ph::after { content: ""; position: absolute; inset: 0; background: var(--a); mix-blend-mode: screen; opacity: .7; }
  @keyframes strip { from { transform: translateX(80px); } to { transform: translateX(-560px); } }

  /* Sahne 6: daire büyüyüp ekranı kaplar */
  #s6 .bubble { position: absolute; left: 1180px; top: 560px; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: var(--a);
    animation: grow 1.4s cubic-bezier(.65,0,.35,1) var(--d) both; }
  @keyframes grow { from { transform: scale(0); } to { transform: scale(32); } }
  #s6 .arrow { position: absolute; left: 1180px; top: 560px; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  #s6 .copy { position: absolute; left: 100px; top: 210px; color: #fff; }
  #s6 h2 { font-size: 168px; line-height: .92; letter-spacing: -0.05em; }
  #s6 .wlogo { margin-top: 70px; width: 420px; }
  #s6 .site { margin-top: 18px; color: rgba(255,255,255,.75); }
</style>
</head>
<body>

<!-- 0 – 3.0 : şerit + logo -->
<section class="scene" id="s1" style="--s:0s; --e:3.0s">
  <svg class="ribbon" viewBox="0 0 1600 900" width="1600" height="900" style="position:absolute;inset:0" fill="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1f45ff"/><stop offset="1" stop-color="#7d93ff"/></linearGradient></defs>
    <path pathLength="1" style="--d:.1s" d="M -80 640 C 250 820 520 760 640 560 C 760 360 600 210 470 300 C 340 390 470 600 760 620 C 1060 640 1260 300 1680 220" stroke="url(#g)" stroke-width="40" stroke-linecap="round"/>
  </svg>
  <div class="logo"><img src="../../public/logo.png" alt="" style="--d:1.0s"></div>
</section>

<!-- 3.0 – 7.2 : "Siz anlatın, biz …" dönen fiil -->
<section class="scene vcenter" id="s2" style="--s:3.0s; --e:7.2s; padding:0">
  <h1>
    <span class="line"><span style="--d:3.1s">You tell us,</span></span>
    <span class="line"><span style="--d:3.25s">we</span></span>
    <span class="slot">
      <span class="first" style="--d:3.45s; --o:4.7s">design it.</span>
      <span style="--d:4.7s; --o:5.8s">code it.</span>
      <span class="last" style="--d:5.8s">ship it.</span>
    </span>
  </h1>
</section>

<!-- 7.2 – 11.0 : işler -->
<section class="scene" id="s3" style="--s:7.2s; --e:11.0s">
  <h2><span class="line"><span style="--d:7.25s">Every project, <span class="blue">its own identity.</span></span></span></h2>
  <div class="grid">
    <div class="card" style="--d:7.5s;  --r:-6deg"><img src="../../public/videos/lecmic-poster.jpg" alt=""></div>
    <div class="card" style="--d:7.62s; --r:5deg"><img src="../../public/videos/codevocab-poster.jpg" alt=""></div>
    <div class="card" style="--d:7.74s; --r:-4deg"><img src="../../public/videos/work-neonotokurtarma.jpg" alt=""></div>
    <div class="card" style="--d:7.86s; --r:6deg"><img src="../../public/videos/work-cultivatedvoicesystem.jpg" alt=""></div>
    <div class="card" style="--d:7.98s; --r:-5deg"><img src="../../public/videos/work-plusotoyol.jpg" alt=""></div>
    <div class="card" style="--d:8.10s; --r:4deg"><img src="../../public/videos/work-whyasaf.jpg" alt=""></div>
    <div class="card" style="--d:8.22s; --r:-6deg"><img src="../../public/videos/work-vitrenyapi.jpg" alt=""></div>
  </div>
</section>

<!-- 11.0 – 14.0 : kendi ürünlerimiz -->
<section class="scene" id="s4" style="--s:11.0s; --e:14.0s">
  <h2><span class="line"><span style="--d:11.05s">Our own <span class="blue">products.</span></span></span></h2>
  <div class="big" style="--d:11.3s; --x:-220px"><div class="img"><img src="../../public/videos/lecmic-poster.jpg" alt="" style="--d:11.3s"></div><div class="meta"><b>Lecmic</b><span class="mono">Open source</span></div></div>
  <div class="big" style="--d:11.45s; --x:220px"><div class="img"><img src="../../public/videos/codevocab-poster.jpg" alt="" style="--d:11.45s"></div><div class="meta"><b>CodeVocab</b><span class="mono">Free</span></div></div>
</section>

<!-- 14.0 – 17.0 : Tasarım ve kod aynı masada. -->
<section class="scene" id="s5" style="--s:14.0s; --e:17.0s">
  <div class="words">
    <span class="line"><span style="--d:14.1s">Design and code</span></span>
    <span class="line"><span class="blue" style="--d:14.35s">at the same table.</span></span>
  </div>
  <div class="strip" style="--d:14.0s">
    <div class="ph"><img src="../../public/work/vitren/hero.webp" alt=""></div>
    <div class="ph"><img src="../../public/work/vitren/tower.webp" alt=""></div>
    <div class="ph"><img src="../../public/work/vitren/horizon.webp" alt=""></div>
    <div class="ph"><img src="../../public/work/vitren/about.webp" alt=""></div>
  </div>
</section>

<!-- 17.0 – 20.5 : daire kaplar, kapanış -->
<section class="scene" id="s6" style="--s:17.0s; --e:99s">
  <div class="arrow pop" style="--d:17.05s">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><path d="M4.5 12h14" stroke="#1f45ff" stroke-width="2.4" stroke-linecap="round"/><path d="M13 6.5 18.5 12 13 17.5" stroke="#1f45ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="bubble" style="--d:17.6s"></div>
  <div class="copy">
    <h2><span class="line"><span style="--d:18.4s">Let's</span></span><span class="line"><span style="--d:18.55s">talk.</span></span></h2>
    <img class="wlogo fade" src="../../public/logo-white.png" alt="" style="--d:19.1s">
    <div class="site mono fade" style="--d:19.3s; color: rgba(255,255,255,.75)">markilabs.com</div>
  </div>
</section>

</body>
</html>
